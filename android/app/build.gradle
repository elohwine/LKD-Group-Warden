apply plugin: 'com.android.application'

def envOrProperty = { String name ->
    System.getenv(name) ?: project.findProperty(name)
}

def keystorePath = envOrProperty('WARDEN_KEYSTORE_PATH')
def keystoreAlias = envOrProperty('WARDEN_KEYSTORE_ALIAS')
def keystorePassword = envOrProperty('WARDEN_KEYSTORE_PASSWORD')
def keystoreAliasPassword = envOrProperty('WARDEN_KEY_PASSWORD')

if (!keystorePath || !keystoreAlias || !keystorePassword || !keystoreAliasPassword) {
    throw new GradleException('Missing WARDEN_KEYSTORE_* environment variables. Export WARDEN_KEYSTORE_PATH, WARDEN_KEYSTORE_ALIAS, WARDEN_KEYSTORE_PASSWORD, and WARDEN_KEY_PASSWORD before building.')
}

android {
    namespace "com.ldk.warden"
    compileSdk rootProject.ext.compileSdkVersion

    signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreAliasPassword
            }
        }
    defaultConfig {
        applicationId "com.ldk.warden"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ✅ Java 17 settings
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    /*
    kotlinOptions {
        jvmTarget = "17" // REMOVE or comment this out if not using Kotlin
    }
    */

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Rename output APK to a specific branded filename
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                outputFileName = "ldk-warden-v${variant.versionName}-release-signed.apk"
            }
        }
    }
}


repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// --- Clean old APK/AABs before packing a new release ---
tasks.register("cleanOutputs", Delete) {
    delete fileTree(dir: "$buildDir/outputs", include: ["apk/**", "bundle/**"])    
    delete "$buildDir/intermediates", "$buildDir/tmp"
}

// Ensure cleanOutputs runs before assembleRelease
tasks.matching { it.name == "assembleRelease" }.all { dependsOn("cleanOutputs") }
